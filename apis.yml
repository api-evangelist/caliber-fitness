aid: caliber-fitness
name: Caliber Fitness
description: 'Caliber Fitness, Inc. is a consumer strength-training and fitness-coaching
  company behind the Caliber: Strength Training app (iOS and Android). Caliber combines
  data-driven resistance-training and nutrition programming, a library of 600+ exercises,
  workout tracking, and one-on-one video coaching from certified personal trainers
  across free, Caliber Plus, and Premium Coaching tiers. Founded by Justin Fauci and
  Chris Muir, the company is backed by Trinity Ventures. Caliber operates as a consumer
  mobile app and coaching service; it does not publish a public developer API, developer
  portal, or OpenAPI at this time. This profile tracks its public web, legal, and
  membership surface within the API Evangelist network.'
